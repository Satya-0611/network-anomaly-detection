spring.application.name=network-anomaly-detection

spring.kafka.producer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# format the keys and values
# standard String formatting for the Key
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Spring's built-in Jackson serializer - Java Object into perfect JSON
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Actuator end-points
management.endpoints.web.exposure.include=health,info,metrics, prometheus
# prometheus endpoints
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true